<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Para mi Cele 💙</title>
<style>
@font-face{font-family:Olita;src:url('olita.ttf') format('truetype');font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
body{font-family:Olita,Georgia,serif;touch-action:manipulation}
.scene{position:fixed;inset:0;background:#000}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#words{z-index:2}
#fx{z-index:6;pointer-events:none}
.vignette{position:fixed;inset:0;z-index:8;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.7) 100%)}
#start{position:fixed;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity 1.2s ease}
#start.hide{opacity:0;pointer-events:none}
.startBox{text-align:center;padding:25px}
.tiny{font:11px system-ui,sans-serif;letter-spacing:.32em;text-transform:uppercase;opacity:.5;margin-bottom:14px}
.tap{font-size:clamp(20px,4vw,38px);text-shadow:0 0 10px #fff,0 0 28px #28aaff,0 0 60px #087dcc;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.035);filter:brightness(1.2)}}
#last{position:fixed;z-index:15;left:50%;bottom:7vh;transform:translateX(-50%);opacity:0;pointer-events:none;border:0;background:none;color:#fff;font:clamp(18px,3.5vw,36px) Olita,Georgia,serif;text-shadow:0 0 8px #fff,0 0 25px #35bfff,0 0 55px #0088ff;white-space:nowrap;cursor:pointer;transition:opacity 1s ease}
#last.show{opacity:1;pointer-events:auto;animation:pulse 2s ease-in-out infinite}
#letter{position:fixed;z-index:5;inset:0;display:none;align-items:flex-start;justify-content:center;padding:6vh 10vw 10vh;overflow-y:auto;scroll-behavior:smooth}
#letter.show{display:flex}
.letterText{width:min(850px,100%);margin:auto;font-size:clamp(16px,2.1vw,26px);line-height:1.6;text-align:center;white-space:pre-wrap;text-shadow:0 0 7px rgba(255,255,255,.75),0 0 22px rgba(55,180,255,.55)}
.side{position:fixed;z-index:4;width:min(18vw,200px);height:min(18vw,200px);object-fit:contain;opacity:0;pointer-events:none;filter:drop-shadow(0 0 18px rgba(55,190,255,.55));transition:opacity 1.5s}
.side.show{opacity:.9}
.left{left:1vw;top:24%;animation:fl 5.5s ease-in-out infinite}
.right{right:1vw;top:53%;animation:fr 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-9deg)}50%{transform:translateY(-22px) rotate(11deg)}}
@keyframes fr{0%,100%{transform:translateY(0) rotate(8deg)}50%{transform:translateY(20px) rotate(-12deg)}}
#glow{position:fixed;z-index:1;inset:0;opacity:0;pointer-events:none;transition:opacity 2s;background:radial-gradient(circle,rgba(20,110,180,.18),transparent 48%)}
@media(max-width:650px){.side{width:24vw;height:24vw}.left{left:-2vw}.right{right:-2vw}.letterText{font-size:clamp(15px,4.2vw,22px)}}
</style>
</head>
<body>
<div class="scene"></div>
<canvas id="words"></canvas>
<canvas id="fx"></canvas>
<div id="glow"></div>
<div class="vignette"></div>
<div id="start">
  <div class="startBox">
    <div class="tiny">Una pequeña sorpresa para ti mi niña <33 </div>
    <div class="tiny">(no me salio tan bien, pero es con mucho amoor)</div>
    <div class="tap">Dame un toquesito así bien kiut ♡</div>
  </div>
</div>
<button id="last">Una última coshita... Dame otro toquesito así bien kiut ♡</button>
<img class="side left" id="left" src="1.png" alt="">
<img class="side right" id="right" src="1.png" alt="">
<div id="letter">
  <div class="letterText" id="letterText"></div>
</div>
<audio id="music" src="cele.mp3" preload="auto" loop></audio>

<script>
const GERBERA_POINTS = (() => {
  const points = [];
  const innerCount = 800;
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < innerCount; i++) {
    const r = Math.sqrt(i / innerCount) * 0.18;
    const theta = i * goldenAngle;
    points.push([r * Math.cos(theta), r * Math.sin(theta)]);
  }
  const discRings = 6;
  for (let ring = 0; ring < discRings; ring++) {
    const r = 0.18 + (ring / discRings) * 0.16;
    const numPetals = 35 + ring * 8;
    for (let i = 0; i < numPetals; i++) {
      const angle = (i / numPetals) * Math.PI * 2 + (ring % 2) * 0.1;
      const len = 0.04 + Math.random() * 0.02;
      for (let step = 0; step < 5; step++) {
        const pr = r + (step / 5) * len;
        points.push([pr * Math.cos(angle), pr * Math.sin(angle)]);
      }
    }
  }
  const petalLayers = [
    { count: 32, minR: 0.32, maxR: 0.72, width: 0.045 },
    { count: 36, minR: 0.33, maxR: 0.88, width: 0.050 },
    { count: 40, minR: 0.34, maxR: 1.00, width: 0.052 }
  ];
  petalLayers.forEach((layer, layerIdx) => {
    const angleOffset = (layerIdx * Math.PI) / layer.count;
    for (let i = 0; i < layer.count; i++) {
      const baseAngle = (i / layer.count) * Math.PI * 2 + angleOffset;
      const stepsR = 18;
      const stepsW = 4;
      for (let sr = 0; sr <= stepsR; sr++) {
        const t = sr / stepsR;
        const currentR = layer.minR + t * (layer.maxR - layer.minR);
        const wFactor = Math.sin(t * Math.PI) * layer.width * (1 - t * 0.2);
        for (let sw = -stepsW; sw <= stepsW; sw++) {
          const wOffset = (sw / stepsW) * wFactor;
          const perpAngle = baseAngle + Math.PI / 2;
          const x = currentR * Math.cos(baseAngle) + wOffset * Math.cos(perpAngle);
          const y = currentR * Math.sin(baseAngle) + wOffset * Math.sin(perpAngle);
          const rx = x + (Math.random() - 0.5) * 0.008;
          const ry = y + (Math.random() - 0.5) * 0.008;
          points.push([rx, ry]);
        }
      }
    }
  });
  return points;
})();

(()=>{'use strict';
const c=document.getElementById('words'),ctx=c.getContext('2d'),fx=document.getElementById('fx'),f=fx.getContext('2d');
const start=document.getElementById('start'),last=document.getElementById('last'),letter=document.getElementById('letter'),lt=document.getElementById('letterText'),music=document.getElementById('music'),left=document.getElementById('left'),right=document.getElementById('right'),glow=document.getElementById('glow');
let W,H,D,mode='intro',phaseStart=performance.now(),pts=[],stars=[],started=false;
const phrases=['TE AMO','TE QUIERO','I LOVE YOU','TE AMO MUCHO','LOVE YOU'];

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}

function resize(){
  D=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  [c,fx].forEach(q=>{q.width=W*D;q.height=H*D;q.style.width=W+'px';q.style.height=H+'px'});
  ctx.setTransform(D,0,0,D,0,0);
  f.setTransform(D,0,0,D,0,0);
  if(mode==='c') buildC();
}
addEventListener('resize',resize);
resize();

function buildC(){
  pts = [];
  const radius = Math.min(W, H) * 0.22;
  const startAngle = 0.25 * Math.PI; 
  const endAngle = 1.75 * Math.PI;   
  const numRings = 4;                
  const pointsPerRing = 18;          
  
  let count = 0;
  for (let r = 0; r < numRings; r++) {
    const curR = radius - (r * 18);  
    for (let i = 0; i < pointsPerRing; i++) {
      const angle = startAngle + (i / (pointsPerRing - 1)) * (endAngle - startAngle);
      const tx = Math.cos(angle) * curR;
      const ty = Math.sin(angle) * curR;
      
      pts.push({
        x: (Math.random() - 0.5) * W,
        y: (Math.random() - 0.5) * H,
        tx: tx,
        ty: ty,
        a: 0,
        delay: (count / (numRings * pointsPerRing)) * 0.8,
        word: phrases[count % phrases.length],
        seed: Math.random() * 30
      });
      count++;
    }
  }
}

function drawC(progress,fade=1){
  ctx.clearRect(0,0,W,H);
  if(fade <= 0) return;
  const now=performance.now()/1000;
  for(const p of pts){
    const appear=clamp((progress-p.delay)/.055,0,1),e=ease(appear),tx=W/2+p.tx,ty=H/2+p.ty;
    p.x+=(tx-p.x)*.08;
    p.y+=(ty-p.y)*.08;
    p.a+=(fade*e-p.a)*.09;
    if(p.a<.01)continue;
    const flick=.85+.15*Math.sin(now*3+p.seed);
    
    ctx.font='700 12px system-ui, -apple-system, sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.shadowBlur=10;
    ctx.shadowColor='rgba(35,180,255,1)';
    ctx.fillStyle=`rgba(130,220,255,${0.95*p.a*flick})`;
    ctx.fillText(p.word,p.x,p.y);
  }
  ctx.shadowBlur=0;
}

function makeStars(n=180){
  stars=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:-3-Math.random()*8,vy:.2+Math.random()*2,life:.5+Math.random(),len:30+Math.random()*120}));
}

function burst(){
  for(let i=0;i<170;i++){
    const a=Math.random()*Math.PI*2,s=2+Math.random()*8;
    stars.push({x:W/2,y:H/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,len:4+Math.random()*25});
  }
}

function drawStars(){
  f.clearRect(0,0,W,H);
  for(const s of stars){
    s.x+=s.vx;s.y+=s.vy;s.life-=.012;
    if(s.life<=0||s.x<-160||s.y>H+50){
      s.x=W+Math.random()*100;s.y=Math.random()*H;s.life=.7+Math.random()*.6;
    }
    s.vx*=.995;s.vy+=.002;
    f.beginPath();
    f.moveTo(s.x,s.y);
    f.lineTo(s.x+s.len,s.y-s.len*.17);
    f.strokeStyle=`rgba(100,210,255,${.4*s.life})`;
    f.lineWidth=1;
    f.shadowBlur=8;
    f.shadowColor='rgba(50,180,255,.9)';
    f.stroke();
  }
  f.shadowBlur=0;
}

function musicOn(){
  music.volume=.68;
  const p=music.play();
  if(p)p.catch(()=>{});
}

function setMode(m){
  mode=m;
  phaseStart=performance.now();
  if(m==='c'){buildC();makeStars(100)}
  if(m==='stars'){makeStars(230);burst()}
  if(m==='letter'){
    ctx.clearRect(0, 0, W, H);
    letter.classList.add('show');
    left.classList.add('show');
    right.classList.add('show');
    typeLetter();
  }
  if(m==='flower'){letter.classList.remove('show');left.classList.remove('show');right.classList.remove('show');glow.style.opacity=1;drawFlower()}
}

start.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(started)return;
  started=true;
  musicOn();
  start.classList.add('hide');
  setMode('c');
},{passive:false});

last.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(mode!=='last')return;
  last.classList.remove('show');
  setMode('flower');
},{passive:false});

const message=`Te amo mucho, mi Cele. 💙

En verdad le agradezco a la vida por haberme dado la oportunidad de conocerte, porque entre tantas personas, tantos caminos y tantos días posibles, de alguna manera nuestros caminos se cruzaron.

Desde que llegaste a mi vida entendí que hay personas que no solamente llegan… llegan para quedarse en un lugar especial del corazón.

Eres una persona increíble, maravillosa y hermosa. Y no hablo solamente de lo que mis ojos pueden ver; hablo de tu forma de ser, de tu corazón, de tu manera de hacerme sonreír y de esos pequeños detalles tuyos que quizá para ti parecen insignificantes, pero que para mí significan muchísimo.

Eres muy especial para mí, Cele. Mucho más de lo que a veces sé explicar con palabras.

Prometo esforzarme cada día para hacerte sentir la chica más feliz, querida y amada del mundo. Quiero cuidarte, escucharte, apoyarte y estar para ti tanto en los días bonitos como en esos días en los que necesites un poquito más de cariño.

Quiero ser esa persona con la que puedas reír hasta que te duela la barriga, hablar de cualquier tontería durante horas, compartir tus sueños y sentirte tranquila siendo completamente tú.

Y si algún día dudas de lo maravillosa que eres, quiero recordártelo yo.

Porque tú mereces que te quieran bonito. Mereces detalles, paciencia, abrazos, palabras sinceras y alguien que mire tus ojos y piense: “qué suerte la mía de tenerte”.

Gracias por existir. Gracias por ser tú. Gracias por cada sonrisa que me has regalado, por cada conversación, por cada momento y por cada recuerdo que poco a poco se ha vuelto importante para mí.

No sé qué nos depare el futuro, pero sí sé algo: mientras pueda, quiero seguir creando recuerdos contigo, seguir conociéndote, seguir admirándote y seguir encontrando nuevas razones para quererte.

Y si pudiera pedirle un deseo a las estrellas, sería sencillo:

que nunca te falten motivos para sonreír… y que, cuando sonrías, yo pueda estar cerca para verlo.

Te amo, mi Cele. 🌷💙
Muchísimo más de lo que estas palabras alcanzan a decir.`;

async function typeLetter(){
  lt.textContent='';
  letter.scrollTop=0;
  for(let i=0;i<message.length;i++){
    if(mode!=='letter')return;
    lt.textContent=message.slice(0,i+1);
    letter.scrollTo({top:letter.scrollHeight,behavior:'smooth'});
    const ch=message[i];
    await new Promise(r=>setTimeout(r,ch==='\n'?500:('.!?'.includes(ch)?170:44)));
  }
  if(mode==='letter')setTimeout(()=>{if(mode==='letter'){mode='last';last.classList.add('show')}},2200);
}

function drawFlower(){
  const cx=W/2,cy=H/2-10,scale=Math.min(W,H)*.38,total=GERBERA_POINTS.length,t0=performance.now(),dur=12000;
  function frame(t){
    if(mode!=='flower')return;
    const p=clamp((t-t0)/dur,0,1),count=Math.floor(total*ease(p));
    ctx.clearRect(0,0,W,H);
    ctx.shadowBlur=10;
    ctx.shadowColor='rgba(45,185,255,.95)';
    for(let i=0;i<count;i++){
      const q=GERBERA_POINTS[i],tw=.78+.22*Math.sin(t/420+i*.13);
      ctx.beginPath();
      ctx.arc(cx+q[0]*scale,cy+q[1]*scale,1+((i*17)%9)/9,0,Math.PI*2);
      ctx.fillStyle=`rgba(75,195,255,${.35+.58*tw})`;
      ctx.fill();
    }
    ctx.shadowBlur=0;
    if(p<1)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function animate(t){
  const e=(t-phaseStart)/1000;
  if(mode==='c'){
    drawC(clamp(e/6,0,1));
    if(e>6.5)setMode('stars');
  }else if(mode==='stars'){
    const fadeOut = Math.max(0, 1 - e / 1.2);
    drawC(1, fadeOut);
    drawStars();
    if(e>2.0)setMode('letter');
  }else if(mode==='letter'||mode==='last'){
    drawStars();
  }
  requestAnimationFrame(animate);
}

buildC();
makeStars();
requestAnimationFrame(animate);
})();
</script>
</body>
</html>
